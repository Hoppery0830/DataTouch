; ============================================================
;  YD-ESP32-S3 经典版 (ESP32-S3-WROOM-1-N16R8)
;  模块: 16MB Flash + 8MB Octal PSRAM
;  角色: STM32 <-> ESP32-S3 <-> 手机/网页 通信网关
;  链路: WiFi + WebSocket (网页/小程序直连)
; ============================================================

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; ---------- 16MB Flash + 8MB PSRAM ----------
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
; N8R2 / N16R8 使用的是八线 OPI PSRAM，需要在编译期打开
board_build.arduino.memory_type = qio_opi

; ---------- 串口监视器 ----------
monitor_speed = 115200

; 烧录 / 上传的端口：用 CH340 那个 Type-C 口，改成本机实际 COM 号
; 例如 Windows 下 upload_port = COM4  (可留空让 PlatformIO 自动识别)
; upload_port = COM9

; ---------- 第三方库 ----------
; WebSocketsServer 用于手机/浏览器双向推送
lib_deps =
    links2004/WebSockets @ ^2.4.1

; build 时输出更多信息（可选）
build_flags =
    -DCORE_DEBUG_LEVEL=1
